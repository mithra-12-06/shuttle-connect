<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ShuttleConnect Royal Travel</title>
  <meta name="description" content="Sign in to your ShuttleConnect account to access luxury royal shuttle booking.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── LOGIN-PAGE OVERRIDES ── */
    body { overflow: hidden; }

    /* Animated background particles */
    .particles {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* Shimmer line animation on card */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 4s ease-in-out infinite;
      border-radius: 24px;
    }
    .glass-card { position: relative; overflow: hidden; }
    @keyframes shimmer {
      0%   { left: -100%; }
      100% { left: 200%; }
    }

    /* Blue glow ring around card */
    .glass-card-wrap {
      position: relative;
    }
    .glass-card-wrap::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: linear-gradient(135deg,
        rgba(30,111,255,0.3),
        rgba(255,255,255,0.08),
        rgba(240,192,64,0.15),
        rgba(30,111,255,0.2));
      z-index: -1;
      filter: blur(1px);
    }

    /* Branding badge at top of card */
    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(30,111,255,0.15);
      border: 1px solid rgba(30,111,255,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #7eb8ff;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .login-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2s infinite;
    }

    /* Google sign-in button */
    .google-btn {
      width: 100%; height: 48px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      color: rgba(255,255,255,0.75);
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer;
      transition: 0.28s;
      margin-bottom: 20px;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.13);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .google-icon {
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900;
      color: #4285f4;
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="auth-bg"></div>

  <!-- Glow Orbs -->
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <!-- Floating Particles -->
  <div class="particles" id="particles"></div>

  <!-- Login Card -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="glass-card-wrap">
        <div class="glass-card">

          <!-- Logo -->
          <div class="auth-logo">
            <div class="auth-logo-icon">S</div>
            <div class="auth-logo-text">Shuttle<span>Connect</span></div>
          </div>

          <!-- Badge -->
          <div style="text-align:center;">
            <div class="login-badge">
              <span class="dot"></span>
              Royal Executive Portal
            </div>
          </div>

          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to continue your royal journey</p>

          <!-- Google Sign In -->
          <button class="google-btn" id="googleSignInBtn" type="button">
            <div class="google-icon">G</div>
            Continue with Google
          </button>

          <div class="auth-divider">
            <hr><span>or sign in with credentials</span><hr>
          </div>

          <!-- Form -->
          <form id="loginForm" novalidate>

            <!-- Username -->
            <div class="auth-field">
              <label for="username">Username</label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input
                  class="auth-input"
                  id="username"
                  name="username"
                  type="text"
                  placeholder="Enter your username"
                  autocomplete="username"
                  required
                >
              </div>
            </div>

            <!-- Password -->
            <div class="auth-field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                  class="auth-input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                >
                <button class="toggle-pw" type="button" id="togglePw" aria-label="Toggle password visibility">👁</button>
              </div>
            </div>

            <!-- Remember + Forgot -->
            <div class="auth-meta">
              <label class="remember-wrap">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Sign In Button -->
            <button type="submit" class="auth-btn auth-btn-blue" id="signInBtn">
              🚀 Sign In to My Account
            </button>

          </form>

          <!-- Register link -->
          <p class="auth-footer-text">
            Don't have an account? <a href="register.html">Register!</a>
          </p>

        </div><!-- /glass-card -->
      </div><!-- /wrap -->
    </div>
  </div>

  <script>
    // ── Floating Particles ──
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 3;
      p.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%;
        animation-duration: ${Math.random() * 15 + 10}s;
        animation-delay: ${Math.random() * 10}s;
      `;
      container.appendChild(p);
    }

    // ── Toggle Password ──
    const togglePw = document.getElementById('togglePw');
    const pwInput  = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      togglePw.textContent = isHidden ? '🙈' : '👁';
    });

    // ── Form Submit ──
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('signInBtn');
      btn.textContent = '⏳ Signing In...';
      btn.disabled = true;
      setTimeout(() => {
        // Redirect to home page after login
        window.location.href = 'index.html';
      }, 1200);
    });

    // ── Input focus animations ──
    document.querySelectorAll('.auth-input').forEach(input => {
      input.addEventListener('focus', () => {
        input.closest('.input-wrap').querySelector('.input-icon').style.color = 'rgba(255,255,255,0.7)';
      });
      input.addEventListener('blur', () => {
        input.closest('.input-wrap').querySelector('.input-icon').style.color = 'rgba(255,255,255,0.4)';
      });
    });
  </script>
</body>
</html>
