<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ShuttleConnect</title>
  <meta name="description" content="Sign in to your ShuttleConnect passenger account.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── LOGIN-PAGE OVERRIDES ── */
    body { overflow: hidden; }

    /* Animated background particles */
    .particles {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* Shimmer line animation on card */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 4s ease-in-out infinite;
      border-radius: 24px;
    }
    .glass-card { position: relative; overflow: hidden; }
    @keyframes shimmer {
      0%   { left: -100%; }
      100% { left: 200%; }
    }

    /* Blue glow ring around card */
    .glass-card-wrap {
      position: relative;
    }
    .glass-card-wrap::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: linear-gradient(135deg,
        rgba(30,111,255,0.3),
        rgba(255,255,255,0.08),
        rgba(240,192,64,0.15),
        rgba(30,111,255,0.2));
      z-index: -1;
      filter: blur(1px);
    }

    /* Branding badge at top of card */
    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(30,111,255,0.15);
      border: 1px solid rgba(30,111,255,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #7eb8ff;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .login-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2s infinite;
    }

  </style>
</head>
<body>

  <!-- Background -->
  <div class="auth-bg"></div>

  <!-- Glow Orbs -->
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <!-- Floating Particles -->
  <div class="particles" id="particles"></div>

  <!-- Login Card -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="glass-card-wrap">
        <div class="glass-card">

          <!-- Logo -->
          <div class="auth-logo">
            <div class="auth-logo-icon">S</div>
            <div class="auth-logo-text">Shuttle<span>Connect</span></div>
          </div>

          <!-- Badge -->
          <div style="text-align:center;">
            <div class="login-badge">
              <span class="dot"></span>
              Passenger Portal
            </div>
          </div>

          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to manage your journeys and bookings</p>

          <!-- Form -->
          <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="auth-field">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input
                  class="auth-input"
                  id="email"
                  name="email"
                  type="email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  required
                >
              </div>
            </div>

            <!-- Password -->
            <div class="auth-field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                  class="auth-input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                >
                <button class="toggle-pw" type="button" id="togglePw" aria-label="Toggle password visibility">👁</button>
              </div>
            </div>

            <div id="loginMessage" class="auth-message" role="status" aria-live="polite"></div>

            <!-- Sign In Button -->
            <button type="submit" class="auth-btn auth-btn-blue" id="signInBtn">
              Sign In
            </button>

          </form>

          <!-- Register link -->
          <p class="auth-footer-text">
            Don't have an account? <a href="register.html">Register!</a>
          </p>

        </div><!-- /glass-card -->
      </div><!-- /wrap -->
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
