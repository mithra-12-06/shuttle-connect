
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - ShuttleConnect</title>
  <meta name="description" content="View your ShuttleConnect passenger profile and bookings.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

  <!-- PASSENGER DASHBOARD HEADER -->
  <header class="dashboard-header">

    <a href="index.html" class="logo" aria-label="ShuttleConnect home">
      <span class="logo-icon">S</span>
      Shuttle<span>Connect</span>
    </a>

    <!-- MOBILE NAVIGATION TOGGLE -->
    <button
      type="button"
      class="dashboard-nav-toggle"
      id="dashboardNavToggle"
      aria-controls="dashboardNavigation"
      aria-expanded="false"
      aria-label="Open navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- MAIN NAVIGATION -->
    <nav
      class="dashboard-navigation"
      id="dashboardNavigation"
      aria-label="Primary navigation"
    >
      <a href="index.html">Home</a>
      <a href="index.html#about">About Us</a>
      <a href="last-mile.html">Last-Mile</a>
      <a href="booking.html">Bookings</a>
      <a href="passenger-dashboard.html" class="active">My Bookings</a>
    </nav>

    <!-- LOGOUT -->
    <button
      type="button"
      class="dashboard-logout"
      id="logoutButton"
    >
      Logout
    </button>

  </header>


  <!-- MAIN DASHBOARD CONTENT -->
  <main class="dashboard-container">

    <!-- WELCOME SECTION -->
    <section class="dashboard-welcome">

      <div>
        <p class="dashboard-kicker">PASSENGER DASHBOARD</p>

        <h1 id="welcomeHeading">Welcome</h1>

        <p>
          Review your profile and manage your confirmed journeys.
        </p>
      </div>

      <a
        href="booking.html"
        class="dashboard-primary-link"
      >
        Book a Journey
      </a>

    </section>


    <!-- DASHBOARD MESSAGE -->
    <div
      id="dashboardMessage"
      class="dashboard-message"
      role="status"
      aria-live="polite"
    ></div>


    <!-- PASSENGER PROFILE -->
    <section
      class="profile-card"
      aria-labelledby="profileHeading"
    >

      <div>
        <p class="dashboard-kicker">PROFILE</p>

        <h2 id="profileHeading">Passenger details</h2>
      </div>

      <div
        class="profile-details"
        id="profileDetails"
      >
        <p>Loading profile...</p>
      </div>

    </section>


    <!-- BOOKING HISTORY -->
    <section
      class="booking-section"
      aria-labelledby="bookingsHeading"
    >

      <div class="booking-section-heading">

        <div>
          <p class="dashboard-kicker">JOURNEY HISTORY</p>

          <h2 id="bookingsHeading">My bookings</h2>
        </div>

        <!-- UPCOMING / PREVIOUS TABS -->
        <div
          class="booking-tabs"
          role="tablist"
          aria-label="Booking status"
        >

          <button
            type="button"
            class="booking-tab active"
            id="upcomingTab"
            data-booking-view="upcoming"
            role="tab"
            aria-selected="true"
          >
            Upcoming
          </button>

          <button
            type="button"
            class="booking-tab"
            id="previousTab"
            data-booking-view="previous"
            role="tab"
            aria-selected="false"
          >
            Previous
          </button>

        </div>

      </div>


      <!-- BOOKING LIST -->
      <div
        id="bookingList"
        class="booking-list"
        aria-live="polite"
      >
        <div class="dashboard-empty">
          Loading bookings...
        </div>
      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="dashboard-footer">
    <p>ShuttleConnect</p>
  </footer>


  <!-- TOAST NOTIFICATIONS -->
  <div
    id="dashboardToast"
    class="dashboard-toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- EXISTING DASHBOARD JAVASCRIPT -->
  <script src="js/passenger.js"></script>

</body>
</html>
