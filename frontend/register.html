<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShuttleConnect</title>
  <meta name="description" content="Create your ShuttleConnect passenger account.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <main class="auth-page auth-page-scroll">
    <div class="auth-container">
      <div class="glass-card-wrap">
        <div class="glass-card theme-passenger">
          <div class="auth-logo">
            <div class="auth-logo-icon">S</div>
            <div class="auth-logo-text">Shuttle<span>Connect</span></div>
          </div>

          <h1 class="auth-title">Create Your Account</h1>
          <p class="auth-subtitle">Register to search trips and book seats</p>

          <form id="registerForm" novalidate>
            <div class="auth-field">
              <label for="fullName">Full Name</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">P</span>
                <input class="auth-input" id="fullName" name="fullName" type="text"
                  placeholder="Enter your full name" autocomplete="name" required>
              </div>
            </div>

            <div class="auth-field">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">@</span>
                <input class="auth-input" id="email" name="email" type="email"
                  placeholder="you@example.com" autocomplete="email" required>
              </div>
            </div>

            <div class="auth-field">
              <label for="phone">Phone Number</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">#</span>
                <input class="auth-input" id="phone" name="phone" type="tel"
                  placeholder="Enter your phone number" autocomplete="tel">
              </div>
            </div>

            <div class="field-row">
              <div class="auth-field">
                <label for="regPassword">Password</label>
                <div class="input-wrap">
                  <input class="auth-input" id="regPassword" name="password" type="password"
                    placeholder="Create password" autocomplete="new-password" required>
                  <button class="toggle-pw" type="button" data-password-toggle="regPassword"
                    aria-label="Show password">Show</button>
                </div>
                <div class="strength-bar" aria-hidden="true">
                  <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label" id="strengthLabel">Enter password</div>
              </div>

              <div class="auth-field">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrap">
                  <input class="auth-input" id="confirmPassword" name="confirmPassword" type="password"
                    placeholder="Repeat password" autocomplete="new-password" required>
                  <button class="toggle-pw" type="button" data-password-toggle="confirmPassword"
                    aria-label="Show password">Show</button>
                </div>
              </div>
            </div>

            <div class="terms-wrap">
              <input type="checkbox" id="terms" required>
              <label for="terms">I agree to the account registration terms.</label>
            </div>

            <div id="registerMessage" class="auth-message" role="status" aria-live="polite"></div>

            <button type="submit" class="auth-btn auth-btn-blue" id="signUpBtn">
              Create Passenger Account
            </button>
          </form>

          <p class="auth-footer-text">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
